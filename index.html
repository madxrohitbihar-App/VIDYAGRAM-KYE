<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Get Access Key - MADXROHITBIHAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #05050a;
            --bg-card: rgba(13, 15, 26, 0.85);
            --border-neon: rgba(0, 242, 254, 0.2);
            --border-hover: rgba(0, 242, 254, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --neon-cyan: #00f2fe;
            --neon-blue: #4facfe;
            --neon-green: #00ff66;
            --gradient-cyber: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --gradient-btn: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --shadow-neon: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% -20%, #1a1c3a 0%, var(--bg-deep) 70%);
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-neon);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
        }

        h1 {
            font-size: 18px;
            font-weight: 800;
            background: var(--gradient-cyber);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .key-display-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-family: monospace;
            font-size: 14.5px;
            font-weight: bold;
            color: var(--neon-cyan);
            letter-spacing: 1px;
            word-break: break-all;
            min-height: 48px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 13.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            margin-bottom: 10px;
        }

        .btn-copy {
            background: var(--gradient-btn);
            box-shadow: var(--shadow-neon);
        }

        .btn-copy.copied {
            background: linear-gradient(135deg, #00ff66 0%, #00b347 100%) !important;
            color: #05050a !important;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        #error-notice {
            background: rgba(255, 0, 77, 0.1);
            border: 1px solid rgba(255, 0, 77, 0.4);
            color: #ff4d4d;
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.postimg.cc/gcxZZXRR/image-search-1788716104605.jpg" class="logo-img" alt="Logo">
        <h1> TOKEN GRANTED SUCCESSFULLY!</h1>
        <div class="subtitle">Developer By MedxrohitBihar</div>

        <div id="content-section">
            <div class="key-display-box" id="keyDisplay">MAD3G4F6HF75JD6G4APP</div>
            
            <button class="btn btn-copy" id="copyBtn" onclick="copyKeyContent()">
                <i class="fa-solid fa-copy"></i> Copy Key
            </button>
        </div>

        <div id="error-notice">
            ⚠️ Page refresh detected! Access key session expired.<br><br>Please go back to the main portal and generate a new key.
        </div>
    </div>

    <script>
        function generate20CharKey() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let middle = '';
            for (let i = 0; i < 14; i++) {
                middle += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return 'MAD' + middle + 'APP';
        }

        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                showRefreshError();
            }
        });

        if (window.performance && window.performance.getEntriesByType) {
            const navEntries = window.performance.getEntriesByType('navigation');
            if (navEntries.length > 0 && navEntries[0].type === 'reload') {
                showRefreshError();
            }
        }

        function showRefreshError() {
            document.getElementById('content-section').style.display = 'none';
            document.getElementById('error-notice').style.display = 'block';
            sessionStorage.removeItem('key_generated');
        }

        window.onload = function() {
            let activeKey = sessionStorage.getItem('generated_access_key');
            
            if (!activeKey) {
                activeKey = generate20CharKey();
                sessionStorage.setItem('generated_access_key', activeKey);
            }

            const keyBox = document.getElementById('keyDisplay');
            if (keyBox) {
                keyBox.innerText = activeKey;
            }
        };

        function copyKeyContent() {
            const keyText = document.getElementById('keyDisplay').innerText;
            const copyBtn = document.getElementById('copyBtn');

            navigator.clipboard.writeText(keyText).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Key Copied!';
                
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy Key';
                }, 2000);
            }).catch(err => {
                alert('Failed to copy key.');
            });
        }
    </script>
</body>
</html>
